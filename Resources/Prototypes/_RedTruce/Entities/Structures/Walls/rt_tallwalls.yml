# ── Abstract bases ────────────────────────────────────────────────────────────
- type: entity
  parent: BaseWall
  id: RTBaseWallTall
  suffix: RT, tall
  abstract: true
  components:
  - type: Sprite
    drawdepth: Mobs
  - type: SpriteFade
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Rock

- type: entity
  parent: RTBaseWallTall
  id: RTBaseWallTallMetalWeak
  abstract: true
  components:
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: PerforatedMetallic

- type: entity
  parent: RTBaseWallTall
  id: RTBaseWallTallMetal
  abstract: true
  components:
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: StructuralMetallic

- type: entity
  parent: RTBaseWallTall
  id: RTBaseWallTallMetalStrong
  abstract: true
  components:
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: StructuralMetallicStrong
  - type: RadiationBlocker
    resistance: 10

- type: entity
  parent: RTBaseWallTall
  id: RTBaseWallTallWood
  abstract: true
  components:
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Wood

