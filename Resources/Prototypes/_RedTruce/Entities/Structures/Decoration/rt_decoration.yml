# ── Abstract base for floor decorations ───────────────────────────────────────
- type: entity
  id: RTDecorFloorBase
  suffix: RT, Mapping
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _N14/_MS13/Structures/Decoration/cave_decor.rsi
    snapCardinals: true
    netsync: false
    noRot: true
    drawdepth: FloorObjects
  - type: Damageable
    damageModifierSet: Wood
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Transform
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Clickable

