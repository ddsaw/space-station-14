# chairs.rsi: MS13, modified by Peptide90 | cooking.rsi: INFRARED_BARON for MS13
# 64x64_furniture.rsi, rugs.rsi, rugs64x64.rsi, counters.rsi, barcounter.rsi,
#   table_settler.rsi, metalgrate.rsi, tables.rsi: MS13
# 64x96_furniture.rsi: MS13, modified by Peptide90
# bedsandchairs.rsi, junk.rsi: Interstate-80, modified by Peptide90
# bookshelf.rsi, schooldesk.rsi, desks.rsi: CC0-1.0, Mithrandalf for N14
# np13_misc.rsi: Nukapop-13 | plantpots.rsi: TGStation, modified by Peptide90
# ms13_barricades.rsi, barricades.rsi: MS13 / INFRARED_BARON
# televisions.rsi: MS13 | Store/Street furniture: MS13 + N14 originals

# ══════════════════════════════════════════════════════════════════════════════
#  Abstract bases
# ══════════════════════════════════════════════════════════════════════════════
- type: entity
  id: RTFreeTableBase
  parent: BaseStructure
  name: table
  abstract: true
  components:
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: PlaceableSurface
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 55
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: Sprite
    netsync: false
  - type: Climbable
  - type: Bonkable
    bonkDamage:
      types:
        Blunt: 4
  - type: Clickable

- type: entity
  id: RTFreeTableBaseWood
  parent: RTFreeTableBase
  abstract: true
  components:
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  id: RTFurnitureBase
  parent: BaseStructure
  abstract: true
  components:
  - type: Sprite
    netsync: false
    noRot: true
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: ["Destruction"]

