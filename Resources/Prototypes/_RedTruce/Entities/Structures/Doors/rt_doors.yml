- type: entity
  parent: BaseStructure
  id: RTBaseTallDoor
  name: door
  abstract: true
  suffix: RT, tall
  components:
  - type: InteractionOutline
  - type: AnimationPlayer
  - type: Appearance
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 100
        mask:
        - FullTileMask
        layer:
        - AirlockLayer
  - type: Sprite
    drawdepth: Mobs
    sprite: _N14/_MS13/Structures/Doors/TallDoors/metalblue.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: Door
    bumpOpen: false
    clickOpen: true
    closeTimeOne: 0
    closeTimeTwo: 0
    openTimeOne: 0
    openTimeTwo: 0
    closedDrawDepth: Mobs
    openDrawDepth: Mobs
    openSound:
      path: /Audio/Effects/door_open.ogg
    closeSound:
      path: /Audio/Effects/door_close.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: NavMapDoor
  - type: Occluder
  - type: BlockWeather
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  # RT Lock system (same as RTBaseDoor)
  - type: Lock
    locked: false
    lockOnClick: false
    unlockOnClick: false
    useAccess: false
    showLockVerbs: false
    unlockingSound:
      path: /Audio/_CP14/Items/lockpick_use.ogg
    lockingSound:
      path: /Audio/_CP14/Items/lockpick_use.ogg
  - type: RTLock
    lockType: RTHouseLock
    difficulty: 3

