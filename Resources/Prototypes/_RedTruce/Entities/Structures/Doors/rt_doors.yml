# RedTruce Doors - MS13 / N14 sprites via Nuclear-14
# License: CC-BY-NC-SA-3.0
# FalloutDoors: DesertRose (wooddoor, housedoor, metaldoor, celldoor, irondoor)
# FalloutDoors: Nukapop-13 (tentcloth, spikedgate)
# TallDoors: MS13, modified for SS14 by Peptide (wood, fence, metal variants)
# TallDoors: INFRARED_BARON for MS13 (vaultdoor)
# chaingate.rsi: Fallout-13, modified by Peptide90
# Curtains: Interstate-80, modified by Peptide90
# RollerDoors: Peptide90 for Nuclear14

# ══════════════════════════════════════════════════════════════════════════════
#  Abstract bases
# ══════════════════════════════════════════════════════════════════════════════
- type: entity
  id: RTBaseDoor
  parent: BaseStructure
  name: door
  abstract: true
  components:
  - type: InteractionOutline
  - type: Sprite
    netsync: false
    noRot: true
    sprite: _N14/_MS13/Structures/Doors/FalloutDoors/wooddoor.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: AnimationPlayer
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 100
        mask:
        - FullTileMask
        layer:
        - AirlockLayer
  - type: Door
    bumpOpen: false
    clickOpen: true
    closeTimeOne: 0.2
    closeTimeTwo: 0.6
    openTimeOne: 0.6
    openTimeTwo: 0.2
    openSound:
      path: /Audio/Effects/door_open.ogg
    closeSound:
      path: /Audio/Effects/door_close.ogg
  - type: Appearance
  - type: Airtight
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Occluder
  - type: BlockWeather
  # RT Lock system — all RT doors are lockable.
  # Unlocked by default; mappers set locked: true + lockType per-instance via VarEdit.
  # lockOnClick/unlockOnClick are false so clicking opens/closes the door normally.
  # Use a key (AfterInteract) or lockpick (AfterInteract + skill check) to toggle.
  - type: Lock
    locked: false
    lockOnClick: false
    unlockOnClick: false
    useAccess: false
    showLockVerbs: false
    unlockingSound:
      path: /Audio/_CP14/Items/lockpick_use.ogg
    lockingSound:
      path: /Audio/_CP14/Items/lockpick_use.ogg
  - type: RTLock
    lockType: RTHouseLock
    difficulty: 3

- type: entity
  parent: RTBaseDoor
  id: RTBaseDoorWood
  abstract: true
  components:
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: ["Destruction"]

